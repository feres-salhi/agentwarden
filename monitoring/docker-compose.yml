services:
  loki:
    image: grafana/loki:3.7.8
    ports:
      - "127.0.0.1:3100:3100"

  alloy:
    image: grafana/alloy:v1.20.1
    command: run /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ../logs:/var/log/agentwarden:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
      - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/agentwarden.yaml:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki